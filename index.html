<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anti-Block Toolkit — Support & Download</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #141b2d 0%, #0b0f19 100%);
      color: #e6edf3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      max-width: 540px;
      width: 100%;
      padding: 32px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      color: #f3ba2f;
    }
    p.subtitle {
      color: #8b949e;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    .btn-download {
      display: inline-block;
      background: #238636;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      margin-bottom: 24px;
      transition: background 0.2s;
    }
    .btn-download:hover {
      background: #2ea043;
    }
    .donate-box {
      background: #0d1117;
      border: 1px solid #f3ba2f55;
      border-radius: 12px;
      padding: 20px;
      margin-top: 10px;
    }
    .donate-title {
      color: #f3ba2f;
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 1.05rem;
    }
    .wallet {
      background: #161b22;
      border: 1px dashed #30363d;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.85rem;
      word-break: break-all;
      color: #58a6ff;
      margin: 12px 0;
    }
    .copy-btn {
      background: #f3ba2f;
      color: #0b0f19;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    .copy-btn:hover {
      background: #ffd700;
    }
    .footer-links {
      margin-top: 20px;
      font-size: 0.85rem;
    }
    .footer-links a {
      color: #8b949e;
      text-decoration: none;
      margin: 0 8px;
    }
    .footer-links a:hover {
      color: #e6edf3;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛡️ Anti-Block Toolkit</h1>
    <p class="subtitle">Fast, Local Windows DPI & DNS Bypass — Zero Ping Penalty</p>

    <a class="btn-download" href="https://github.com/phoenixisgame/AntiBlockToolkit/releases">
      ⬇️ Download Latest Release (Windows)
    </a>

    <div class="donate-box">
      <div class="donate-title">💛 Support Project (BNB / USDT - BEP20)</div>
      <div style="font-size: 0.85rem; color: #8b949e;">
        RedotPay / BNB Smart Chain (BEP20) Wallet Address:
      </div>
      <div class="wallet" id="walletAddr">0x2F8D26b67d8be078A2BE40c1887379232746fD79</div>
      <button class="copy-btn" onclick="copyWallet()">Copy Address</button>
      <div id="statusMsg" style="color:#3fb950; font-size:0.85rem; margin-top:8px;"></div>
    </div>

    <div class="footer-links">
      <a href="https://github.com/phoenixisgame/AntiBlockToolkit">GitHub Repository</a> •
      <a href="https://github.com/phoenixisgame/AntiBlockToolkit/issues">Report Issue</a>
    </div>
  </div>

  <script>
    function copyWallet() {
      const addr = document.getElementById('walletAddr').innerText;
      navigator.clipboard.writeText(addr).then(() => {
        document.getElementById('statusMsg').innerText = '✅ Wallet address copied to clipboard!';
      });
    }
  </script>
</body>
</html>
